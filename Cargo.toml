[package]
name = "pinyin"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[dependencies]
# `loadable-extension` is what lets the crate register into a DuckDB it was not
# linked against. It brings in `vtab` with it, which is where `types` (and so
# `DuckString`) lives. The `vscalar` feature is deliberately absent: it exists
# for the `VScalar` trait, which builds its argument marshalling on the Arrow
# C data interface, and every function here reads DuckDB's vectors directly.
duckdb = { version = "~1.10505.0", features = ["loadable-extension"] }
