#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: pinyin
      extra_toolchains: rust;python3
      # The wasm archs are on. The template's `src/wasm_lib.rs` shim re-roots the
      # crate one directory down, so `src/lib.rs`'s submodules only resolve under
      # both roots because they carry `#[path]` — see that block.
      #
      # Worth knowing what this job does and does not check: it compiles, links
      # and uploads the wasm artifact, and nothing loads it. A green run means it
      # builds for wasm32-unknown-emscripten, not that it runs.
      #
      # `linux_amd64_musl` is opt-in and so already off by default; it is named
      # anyway so the intent survives a change to that default.
      exclude_archs: 'linux_amd64_musl'
