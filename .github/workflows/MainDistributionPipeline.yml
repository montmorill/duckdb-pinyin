#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: pinyin
      extra_toolchains: rust;python3
      # The wasm builds compile `src/wasm_lib.rs`, whose `mod lib;` puts the
      # crate root one directory down and so cannot see this crate's submodules
      # — `cargo build --example pinyin` does not compile. They are off until
      # that is reworked; there is no wasm toolchain here to verify a fix with.
      # `linux_amd64_musl` is opt-in and so already off by default, but is named
      # here so the intent survives a change to that default.
      exclude_archs: 'linux_amd64_musl;wasm_mvp;wasm_eh;wasm_threads'
